<bo>
  <h1>音视频的学习</h1>
  <h2>1.视频基础</h2>
  <p>插入视频的方法如下：</p>
  <video src="./反诈视频.mp4" type="video/mp4" controls width="400" 
  title="反诈视频" muted autoplay loop poster="./反诈视频封面.jpg"></video>
<!-- 视频属性 autoplay 自动播放 loop 循环播放 muted 静音 
 poster 预览图像 自动播放前要先静音-->
  <p>还有一种兼容性写法</p>
  <!-- <video width="400" controls muted loop >
    <source src="./反诈视频.mp4" type="video/mp4">
    <source src="./反诈视频.ogg" type="video/ogg">
    <p>您的浏览器不支持ogg标签。</p>
  </video> -->
  <h2>2.音频基础</h2>
  <p>插入音频的方法如下：</p>
  <audio src="" type="audio/mp3" controls loop muted></audio>
  <!-- <p>兼容性写法</p>
  <audio controls muted loop>
    <source src="./反诈视频.mp3" type="audio/mp3">
    <source src="./反诈视频.ogg" type="audio/ogg">

  </audio> -->
</body>
</html>
