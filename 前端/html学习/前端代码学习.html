<!DOCTYPE html>
<!--DOCTYPE html是文档类型声明，告诉浏览器这是一个HTML5文档--> 
<html lang="zh-CN">
<!--lang="zh-CN"表示页面使用中文语言,"en"一般为默认为英语-->
<head><!--head是头部标签，里面放置的是网页的元信息-->
  <meta charset="UTF-8"><!--meta标签是元信息标签，
  charset="UTF-8"表示网页使用的字符编码为UTF-8-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 这句话用于移动端页面适配-->
  <title>HTML前端代码的初次接触</title>
</head>
<body>
  <!--以下<>是标签,h1是标题，p是段落，这些都是双标签
  <hr>是单标签，代表水平线-->
  <h1>HTML前端代码学习</h1>
  <hr>
  <h2>html初体验感想</h2>
  <p>html与我想的不太一样，
    这跟jinjia2模板语言有点像，都是用来渲染页面的。
  </p>
  <p>jinjia2是一个Python的模板引擎，而HTML是前端标记语言。</p>
</body>
</html>
