<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表格</title>
</head>
<body>
  <h2>表格基本语法</h2>
  <!-- 有以下标签 table 表格内容 tr 行标签 td 单元格标签
  th 表头标签 -->
  <p>现在创建一个表格</p>
  <table border="1">
    <tr>
      <th>姓名</th>
      <th>年龄</th>
      <th>成绩</th>
    </tr>
    <tr>
      <td>罗小黑</td>
      <td>10</td>
      <td>85</td>
    </tr>
  </table>
  <table border="1">
  <h2>表格结构标签</h2>
      <thead>
        <tr>
        <th>姓名</th>
        <th>年龄</th>
        <th>成绩</th>
      </tr>
    </thead>
      <tbody>
        <tr>
        <td>罗小黑</td>
        <td>10</td>
        <td>85</td>
      </tr>
    </tbody>
      <tfoot>
        <tr>
          <td>罗小白</td>
          <td>10</td>
          <td>80</td>
      </tr>
    </tfoot>
  </table>
  <table border="1">
  <h2>合并单元格</h2>
        <tr>
        <th>姓名</th>
        <th>年龄</th>
        <th>语文成绩</th>
        <th>数学成绩</th>
        <th>地点</th>
      </tr>
        <tr>
        <td>罗小黑</td>
        <td>10</td>
        <td colspan="2">85</td>
        <td rowspan="2">北京</td>
      </tr>
        <tr>
          <td>罗小白</td>
          <td>10</td>
          <td colspan="2">80</td>
      </tr>
  </table>
</body>
</html>
