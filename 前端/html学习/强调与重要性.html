<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>强调，注释与重要性</title>
</head>
<body>
  <h1>强调，注释与重要性</h1>
  <p>在HTML中，我们可以使用<em>罗小黑战记</em>来强调文本，通常会以<em>斜体</em>显示。</p>
  <p>如果我们想要表示更强烈的强调，可以使用<strong>罗小白</strong>，通常会以<strong>加粗</strong>显示。</p>
  <p>还有<ins>下划线</ins>，也可以强调，如<ins>罗根</ins>。</p>
  <p>此外，还有<del>删除线</del>，用于表示文本已被删除，如<del>罗小黑</del>。</p>
  <p>此外，还有<mark>无限</mark>，用于标记文本，通常会以<mark>高亮</mark>显示。</p>
  <p>注释用ctrl+/快捷使用</p>
  <p>这些标签可以帮助我们在网页中突出显示重要的信息。</p>
</body>
</html>
