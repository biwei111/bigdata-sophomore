<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>块级元素和内联元素以及图像标签</title>
</head>
<body>
  <h1>块级元素和内联元素</h1>
  <!-- <p>在HTML中，块级元素和内联元素是两种不同的元素类型。</p>
  <p>块级元素通常会占据一整行，并且会在其前后产生换行。例如，<div>、<p>、<h1>等都是块级元素。</p>
  <p>内联元素则不会占据整行，它们通常只会占据其内容所需的空间。例如，<span>、<a>、<strong>等都是内联元素。</p>
  <p>了解块级元素和内联元素的区别对于网页布局和样式设计非常重要。</p> -->
  <p>图像标签是在网页上体现图片的一种表现形式。例如下方的图片：</p>
  <img src="影之刃零.jpg" alt="最终boss图片" 
  width="300" height="300" title="影之刃零最终boss甄子丹图片">
  <p>img是单标签，src属性用于指定图片的路径，
    alt属性用于图片无法显示时提供图片的替代文本。
  宽和高只修改一个就行,title属性用于提供鼠标所悬停时图片的标题信息。</p>
</body>
</html>
