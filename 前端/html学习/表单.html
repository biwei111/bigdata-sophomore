<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>表单</title>
</head>
<body>
  <h1>表单</h1>
  <p>1.表单容器</p>
  <!-- 标签为 <form> ，包裹所有表单控件 默认有action属性 -->
    <form action="">
      <!-- 2.表单控件 -->
      <!-- 2.1 input -->
      <ul> 
        <li>
          <!-- 1.单行文本框+label 方式2 -->
          <label>
            用户名：<input type="text" name="username" 
          value="" placeholder="请输入用户名"
          accesskey="s" autocomplete="on">
          </label>
        </li>
        <li>
          <!-- 2.密码框 -->
          <label>
            密码：<input type="password" name="password" 
          value="" maxlength="20" 
          placeholder="请输入密码" autocomplete="off">
          </label>
        </li>
        <li>
          <!-- 3.单选框+label 方式1-->
          性别：
          <input type="radio" name="sex" value="男" checked id="male">
          <label for="male">男</label>
          <input type="radio" name="sex" value="女" id="female">
          <label for="female">女
          </label>
        </li>
        <li>
          <!-- 4.多选框+label 方式2 -->
          爱好：
          <label>
            <input type="checkbox" name="hobby" value="篮球"checked>篮球
          </label>
          <label>
            <input type="checkbox" name="hobby" value="足球">足球
          </label>
          <label>
            <input type="checkbox" name="hobby" value="羽毛球">羽毛球
          </label>
        </li>
        <li>
          <!-- 5.文件域 -->
          <label>
            上传文件：<input type="file" name="file" multiple 
            accept=".jpg,.png,.gif,.exe,.zip,.mp4,.mp3,.txt">
          </label>
        </li>
        <li>
      <!--2.2 textarea  -->
          <!-- 多行文本域 -->
          <label>
            <p>评论区</p>
          <textarea name="comment" rows="10" cols="60"
          placeholder="请输入评论" maxlength="60"></textarea>
          </label>
        </li>
        <li>
      <!-- 2.3 下拉列表 -->
          <label>
            请选择城市：<select name="city" id="">
            <option value="北京">北京</option>
            <option value="上海">上海</option>
            <option value="广州">广州</option>
            <option value="深圳" selected>深圳</option>
          </select>
          </label>
        </li>
        <li>
      <!-- 2.4 自定义按钮 -->
          <!-- <input type="button" value="登录" onclick="alert('登录成功')"> -->
          <button disabled>登录</button>
          <button>注册</button>
          <button type="reset">重置</button>
          <button type="submit">提交</button>
        </li>
        <li>
          <!-- 2.5 label -->
          <!-- 在上面 -->
        </li>
      </ul>
        </li>
      </ul>
    </form>
</body>
</html>
