<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=, initial-scale=1.0">
  <title>网页结构标签</title>
</head>
<body>
  <!-- 网页结构标签有<header>头部、<main>内容、<footer>底部 
  <section>分块、 <nav>导航栏、 <aside>侧边栏、 
    <article>文章、 <details>详情、 
    <summary>摘要
   等块级双标签 -->
   <!-- 以下是无语义标签 -->
   <div>你好</div>
   <div>你好</div>
   <span>你好</span>
   <span>你好</span>
   <!-- 列表标签 无序、有序、描述 -->
   <ul>
     <li>苹果</li>
     <li>香蕉</li>
     <li>橘子</li>
    </ul>
   <ol>
     <li>苹果</li>
     <li>香蕉</li>
     <li>橘子</li>
    </ol>
   <dl>
     <dt>苹果</dt>
     <dd>苹果是一种水果</dd>
     <dt>香蕉</dt>
     <dd>香蕉是一种水果</dd>
     <dt>橘子</dt>
     <dd>橘子是一种水果</dd>
   </dl>
</body>
</html>
