<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>字符实体</title>
</head>
<body>
  <h1>字符实体</h1>
  特殊字符：
  &lt; 小于号
  &gt; 大于号
  &amp; 与号
  &copy; 版权符号
  &reg; 注册商标符号
  &trade; 商标符号
  &nbsp; 空格符号
  &cent; 美分符号
  &pound; 英镑符号
  &yen; 日元符号
  &euro; 欧元符号
  &sect; 节符号
  &para; 段落符号
  &bull; 项目符号
  &prime; 单引号
  &Prime; 双引号
  &frac12; 半符号
  &frac14; 四分之一符号
  &frac34; 三分之一符号
  &times; 乘号
  &divide; 除号
  &plusmn; 正负号
</body>
</html>
